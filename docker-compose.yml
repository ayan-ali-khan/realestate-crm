# Local development database. Defaults below are dev-only credentials
# (not secrets); override via a gitignored .env file for anything shared.
name: realestate-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_crm}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-crm} -d $${POSTGRES_DB:-real_estate_crm}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
